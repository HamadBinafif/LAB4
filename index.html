<!DOCTYPE html>
<html>
<head>
    <title>Great Auto Parts - Order Form</title>
    <style>
        form {
            width: 420px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        textarea {
            height: 170px;
            font-family: monospace;
        }

        button {
            width: 96%;
            padding: 8px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 3px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Great Auto Parts - Order Form</h1>

<form>
    <label for="fname">First Name:</label>
    <input type="text" id="fname" placeholder="Enter your first name">

    <label for="lname">Last Name:</label>
    <input type="text" id="lname" placeholder="Enter your last name">

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter your email address">

    <label for="phone">Phone number:</label>
    <input type="tel" id="phone" placeholder="Enter your phone number">

    <label for="make">Make:</label>
    <input type="text" id="make" placeholder="Make">

    <label for="model">Model:</label>
    <input type="text" id="model" placeholder="Model">

    <label for="year">Year:</label>
    <input type="number" id="year" placeholder="Year">

    <label for="date">Date:</label>
    <input type="date" id="date">

    <label for="part">Spare Part:</label>
    <input type="text" id="part" placeholder="Enter the spare part you need">

    <label for="qty">Quantity:</label>
    <input type="number" id="qty" placeholder="Enter the quantity of the spare part you need">

    <label for="comment">Comment:</label>
    <textarea id="comment" placeholder="Enter your comment"></textarea>

    <button type="submit">Submit</button>
</form>

</body>
</html>
